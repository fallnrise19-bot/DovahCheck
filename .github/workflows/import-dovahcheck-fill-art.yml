name: Derive DovahCheck Companion Artwork

on:
  push:
    branches: [ asset-fill-pass ]

permissions:
  contents: write

jobs:
  derive-art:
    if: "!contains(github.event.head_commit.message, '[companion-crop]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout asset branch
        uses: actions/checkout@v4
        with:
          ref: asset-fill-pass

      - name: Install image tooling
        run: python -m pip install --quiet pillow

      - name: Derive Companions card from Guilds artwork
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path('app/src/main/res/drawable-nodpi/guilds_category.webp')
          out = Path('app/src/main/res/drawable-nodpi/faction_companions.webp')

          im = Image.open(src).convert('RGB')
          w, h = im.size
          # Left-side crop centers the Companions banner while preserving Skyrim scenery.
          crop = im.crop((0, 0, int(w * 0.34), h))
          crop = crop.resize((520, 900), Image.Resampling.LANCZOS)
          crop.save(out, 'WEBP', quality=78, method=6)
          print(out, out.stat().st_size)
          PY

      - name: Commit derived artwork
        shell: bash
        run: |
          git config user.name "DovahCheck Asset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi/faction_companions.webp
          if git diff --cached --quiet; then
            echo "No asset changes."
            exit 0
          fi
          git commit -m "[companion-crop] Add Companions artwork"
          git push origin HEAD:asset-fill-pass
