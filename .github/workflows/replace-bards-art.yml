name: Replace Bards Artwork

on:
  push:
    branches: [ bards-art-replacement ]

permissions:
  contents: write

jobs:
  replace-art:
    if: "!contains(github.event.head_commit.message, '[bards-art]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout asset branch
        uses: actions/checkout@v4
        with:
          ref: bards-art-replacement

      - name: Install image tooling
        run: python -m pip install --quiet pillow

      - name: Download dedicated Bards artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dovah-bards app/src/main/res/drawable-nodpi
          curl -L --fail --retry 2 -o /tmp/dovah-bards/faction_bards_college.png 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-e508-81f5-97fa-9e0fd8b27d6f/raw?se=2026-09-21T05%3A00%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=7a558376-7fc1-555a-bd3c-72dd2c7cf5a4&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T12%3A54%3A05Z&ske=2026-09-21T12%3A54%3A05Z&sks=b&skv=2026-02-06&sig=glOQlFCHsOHur7lp7GMR8T4Ib3PXNWj3053jLun7/c0%3D'

      - name: Optimize Bards artwork
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Path('/tmp/dovah-bards/faction_bards_college.png')
          dst = Path('app/src/main/res/drawable-nodpi/faction_bards_college.webp')
          im = Image.open(src).convert('RGB')
          im.thumbnail((1000, 1000), Image.Resampling.LANCZOS)
          im.save(dst, 'WEBP', quality=78, method=6)
          print(dst, dst.stat().st_size)
          PY

      - name: Commit dedicated Bards artwork
        shell: bash
        run: |
          git config user.name "DovahCheck Asset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi/faction_bards_college.webp
          if git diff --cached --quiet; then
            echo "No asset changes."
            exit 0
          fi
          git commit -m "[bards-art] Replace Bards College artwork"
          git push origin HEAD:bards-art-replacement
