name: Import DovahCheck Artwork

on:
  push:
    branches: [ asset-artwork-pass ]

permissions:
  contents: write

jobs:
  import-art:
    if: "!contains(github.event.head_commit.message, '[asset-import]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout asset branch
        uses: actions/checkout@v4
        with:
          ref: asset-artwork-pass

      - name: Install image tooling
        run: python -m pip install --quiet pillow

      - name: Download source artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dovah-art app/src/main/res/drawable-nodpi

