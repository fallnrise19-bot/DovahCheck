          curl -L --fail --retry 2 -o /tmp/dovah-art/hold_riften.png 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-f234-81f5-9fda-9ffce72baffc/raw?se=2026-09-21T03%3A42%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=357ef91f-a870-57f2-b52f-396cd8b0c11d&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T01%3A07%3A41Z&ske=2026-09-22T01%3A07%3A41Z&sks=b&skv=2026-02-06&sig=ngH6qg7u7uf78RAFIAr7Jj0Cx/hRp/BFJyVTWohzc/o%3D'
          curl -L --fail --retry 2 -o /tmp/dovah-art/hold_dawnstar.png 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-3130-81f5-9a56-2437bd9afc72/raw?se=2026-09-21T03%3A42%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=25331f66-454a-50c4-a3a9-a3f482f4354a&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T14%3A31%3A51Z&ske=2026-09-21T14%3A31%3A51Z&sks=b&skv=2026-02-06&sig=7qeckW1KFHi4bfuN5hNgz0Nxy6rb4rtPreKsCjU5Iak%3D'
          curl -L --fail --retry 2 -o /tmp/dovah-art/hold_windhelm.png 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-66a0-81f5-9350-cdcd8c7984c5/raw?se=2026-09-21T03%3A42%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=44799734-3150-53d9-ac0c-a9ed2204f66e&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T13%3A49%3A54Z&ske=2026-09-21T13%3A49%3A54Z&sks=b&skv=2026-02-06&sig=fNylMfuwYPqfx9Ixn%2BjIUr%2B0CcJkIxM1gmcFtxbLmTU%3D'
          curl -L --fail --retry 2 -o /tmp/dovah-art/hold_falkreath.jpg 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-0820-81f5-adcb-d0111eb72e2a/raw?se=2026-09-21T03%3A42%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=e0c70aa3-903e-5f03-9a9b-4750b28814c7&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T16%3A39%3A02Z&ske=2026-09-21T16%3A39%3A02Z&sks=b&skv=2026-02-06&sig=RV0HxsQSiJU9/4uVPJ4bLOyrKSF1BBeZ/1SR%2B%2BmQMJM%3D'

      - name: Optimize artwork for Android
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path('/tmp/dovah-art')
          dst = Path('app/src/main/res/drawable-nodpi')
          dst.mkdir(parents=True, exist_ok=True)

          for path in src.iterdir():
              if not path.is_file():
                  continue
              im = Image.open(path).convert('RGB')
              im.thumbnail((900, 1100), Image.Resampling.LANCZOS)
              out = dst / (path.stem + '.webp')
              im.save(out, 'WEBP', quality=74, method=6)
              print(path.name, '->', out, out.stat().st_size)
          PY

      - name: Commit optimized artwork
        shell: bash
        run: |
          git config user.name "DovahCheck Asset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi
          if git diff --cached --quiet; then
            echo "No asset changes."
            exit 0
          fi
          git commit -m "[asset-import] Add optimized DovahCheck artwork"
          git push origin HEAD:asset-artwork-pass
