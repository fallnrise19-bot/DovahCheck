          curl -L --fail --retry 2 -o /tmp/dovah-art/hold_whiterun.png 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-cf08-81f5-b510-93913d81dff8/raw?se=2026-09-21T03%3A42%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=244f86f6-ce3d-5372-b963-d6e1ef4c321c&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T14%3A31%3A51Z&ske=2026-09-21T14%3A31%3A51Z&sks=b&skv=2026-02-06&sig=AeeO2/QIlI0liurqjpwb%2BlqK0S8u/zZB2k5HPDCiWDc%3D'
