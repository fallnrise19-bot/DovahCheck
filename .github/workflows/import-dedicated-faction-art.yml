name: Import Dedicated Faction Artwork

on:
  push:
    branches: [ dedicated-faction-art ]

permissions:
  contents: write

jobs:
  import-art:
    if: "!contains(github.event.head_commit.message, '[dedicated-faction-art]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout asset branch
        uses: actions/checkout@v4
        with:
          ref: dedicated-faction-art

      - name: Install image tooling
        run: python -m pip install --quiet pillow

      - name: Download dedicated faction artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dovah-factions app/src/main/res/drawable-nodpi

          curl -L --fail --retry 2 -o /tmp/dovah-factions/faction_blades.png 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-b640-81f5-a6b8-243de1a717d8/raw?se=2026-09-21T04%3A54%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=0b5ba676-7236-5ff3-b9fa-8c48b0ba5730&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T16%3A38%3A50Z&ske=2026-09-21T16%3A38%3A50Z&sks=b&skv=2026-02-06&sig=IFryqyR6cYtiZjp7GBoqhFGllhyK7Vw4Wl/uD1VKVTQ%3D'
          curl -L --fail --retry 2 -o /tmp/dovah-factions/faction_companions.png 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-1dbc-81f5-a9da-e4ebf6132754/raw?se=2026-09-21T04%3A54%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=c41a0968-367c-5f14-bfcb-7eb47d4cd9e1&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T12%3A51%3A41Z&ske=2026-09-21T12%3A51%3A41Z&sks=b&skv=2026-02-06&sig=MP9ciyH/ka8DR5Amna1Is6IqNLSOJLmmOsPN7Lu3Lrc%3D'

      - name: Optimize artwork for Android
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path('/tmp/dovah-factions')
          dst = Path('app/src/main/res/drawable-nodpi')

          for path in src.iterdir():
              im = Image.open(path).convert('RGB')
              im.thumbnail((1000, 1000), Image.Resampling.LANCZOS)
              out = dst / (path.stem + '.webp')
              im.save(out, 'WEBP', quality=78, method=6)
              print(path.name, '->', out, out.stat().st_size)
          PY

      - name: Commit dedicated faction artwork
        shell: bash
        run: |
          git config user.name "DovahCheck Asset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi/faction_blades.webp app/src/main/res/drawable-nodpi/faction_companions.webp
          if git diff --cached --quiet; then
            echo "No asset changes."
            exit 0
          fi
          git commit -m "[dedicated-faction-art] Replace Companions and add Blades artwork"
          git push origin HEAD:dedicated-faction-art
