name: Import Quest Category Artwork

on:
  push:
    branches: [ quest-category-art ]

permissions:
  contents: write

jobs:
  import-art:
    if: "!contains(github.event.head_commit.message, '[quest-category-art]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout asset branch
        uses: actions/checkout@v4
        with:
          ref: quest-category-art

      - name: Install image tooling
        run: python -m pip install --quiet pillow

      - name: Download quest category artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dovah-categories app/src/main/res/drawable-nodpi

          curl -L --fail --retry 2 -o /tmp/dovah-categories/theme_main_story.png 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-b6f0-81f5-b7bf-efaf7c925920/raw?se=2026-09-21T05%3A30%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=52d18088-c29c-5070-b7d8-c24d517a6eec&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T01%3A40%3A55Z&ske=2026-09-22T01%3A40%3A55Z&sks=b&skv=2026-02-06&sig=s3zo55xkuO7b7KbUROMheYKkUg4kbXRRnaVLEdk9PjQ%3D'
          curl -L --fail --retry 2 -o /tmp/dovah-categories/theme_daedric.png 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-be28-81f5-ab54-0d6a7e7e0684/raw?se=2026-09-21T05%3A30%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=32903c8a-49c4-595a-8a82-7964dce9126f&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T18%3A13%3A10Z&ske=2026-09-21T18%3A13%3A10Z&sks=b&skv=2026-02-06&sig=3JQZmQMeltuY8nf3xYa7RmaTAUAYRMinOi6%2B9rGWanM%3D'
          curl -L --fail --retry 2 -o /tmp/dovah-categories/civil_war_imperial.png 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-060c-81f5-a633-1844ebf5db84/raw?se=2026-09-21T05%3A30%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=1c149a86-5e47-5d30-87a7-3474bc3c71d3&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T13%3A49%3A50Z&ske=2026-09-21T13%3A49%3A50Z&sks=b&skv=2026-02-06&sig=PRmOj%2Bipn3va8MSYb15hPog3RtFA5tNTRWWDUWaYrrk%3D'
          curl -L --fail --retry 2 -o /tmp/dovah-categories/theme_side_quests.png 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-2e64-81f5-93df-b8c2f585f24e/raw?se=2026-09-21T05%3A30%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=3e868a11-a83e-536a-a404-8f8947452013&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T18%3A13%3A31Z&ske=2026-09-21T18%3A13%3A31Z&sks=b&skv=2026-02-06&sig=c49IgNlWn5Fi2nq4NU9g0sOjbCJ2%2BWUBnxGG2RbfhkU%3D'

      - name: Optimize artwork for Android
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path('/tmp/dovah-categories')
          dst = Path('app/src/main/res/drawable-nodpi')
          for path in src.iterdir():
              im = Image.open(path).convert('RGB')
              im.thumbnail((1000, 1000), Image.Resampling.LANCZOS)
              out = dst / (path.stem + '.webp')
              im.save(out, 'WEBP', quality=78, method=6)
              print(path.name, '->', out, out.stat().st_size)
          PY

      - name: Commit quest category artwork
        shell: bash
        run: |
          git config user.name "DovahCheck Asset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi/theme_main_story.webp                   app/src/main/res/drawable-nodpi/theme_daedric.webp                   app/src/main/res/drawable-nodpi/civil_war_imperial.webp                   app/src/main/res/drawable-nodpi/theme_side_quests.webp
          if git diff --cached --quiet; then
            echo "No asset changes."
            exit 0
          fi
          git commit -m "[quest-category-art] Add Main Story, Daedric, Civil War and Side Quest artwork"
          git push origin HEAD:quest-category-art
